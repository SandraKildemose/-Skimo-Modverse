<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="assets/skimo-desktop-viewport.js?v=20260405-70"></script>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preload" href="assets/i18n.js?v=20260405-70" as="script" />
    <title data-i18n="loading.title">Loader…</title>
    <script>
      // Sørg for at animation/redirect kun er længere når vi går til install.html.
      (function () {
        try {
          const sp = new URLSearchParams(window.location.search);
          const rawNext = sp.get('next');
          const isInstall = rawNext == null || /(?:^|\/)install\.html(?:$|[?#])/.test(String(rawNext));

          const root = document.documentElement;
          root.style.setProperty('--loading-build-dur', isInstall ? '1.05s' : '0.24s');
          root.style.setProperty('--loading-pass-dur', isInstall ? '1.35s' : '0.26s');
          root.style.setProperty('--loading-pass-delay', isInstall ? '0.55s' : '0.04s');
          root.style.setProperty('--loading-redirect-ms', isInstall ? '1900' : '280');
        } catch {
          // Fallback til hurtig standard (CSS fallback sørger for det).
        }
      })();
    </script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #04070c;
        overflow: hidden;
        font-family: -apple-system, system-ui, Arial, sans-serif;
      }

      .screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 800px at 50% 58%, rgba(22, 95, 134, 0.18) 0%, rgba(4, 7, 12, 0.92) 62%),
          linear-gradient(180deg, rgba(2, 3, 6, 0.72) 0%, rgba(4, 7, 12, 1) 100%);
      }

      .logo-wrap {
        width: min(420px, 74vw);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        position: relative;
      }

      .logo {
        width: 100%;
        height: auto;
        transform: scale(0.86);
        opacity: 0;
        filter: drop-shadow(0 18px 60px rgba(0, 0, 0, 0.6));
        animation: buildIn var(--loading-build-dur, 0.24s) cubic-bezier(0.2, 0.9, 0.16, 1) forwards;
      }

      .shine {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        mix-blend-mode: screen;
        filter: brightness(3.1) saturate(1.45);
        clip-path: polygon(-34% 0, -6% 0, 16% 100%, -12% 100%);
        animation: pass var(--loading-pass-dur, 0.26s) ease-in-out var(--loading-pass-delay, 0.04s) forwards;
        pointer-events: none;
      }

      @keyframes buildIn {
        0% {
          opacity: 0;
          transform: scale(0.82);
          filter: blur(10px) drop-shadow(0 18px 60px rgba(0, 0, 0, 0.7));
        }
        60% {
          opacity: 1;
          transform: scale(1.02);
          filter: blur(0px) drop-shadow(0 22px 72px rgba(0, 0, 0, 0.6));
        }
        100% {
          opacity: 1;
          transform: scale(1);
          filter: drop-shadow(0 22px 72px rgba(0, 0, 0, 0.6));
        }
      }

      @keyframes pass {
        0%,
        20% {
          opacity: 0;
          clip-path: polygon(-34% 0, -6% 0, 16% 100%, -12% 100%);
        }
        36% {
          opacity: 1;
        }
        72% {
          opacity: 0;
          clip-path: polygon(90% 0, 118% 0, 140% 100%, 112% 100%);
        }
        100% {
          opacity: 0;
          clip-path: polygon(90% 0, 118% 0, 140% 100%, 112% 100%);
        }
      }

    </style>
  </head>
  <body>
    <div class="screen" aria-label="Loader">
      <div class="logo-wrap">
        <img class="logo" src="Logoer/Skimo1logo.png" alt="Skimo" />
        <img class="shine" src="Logoer/Skimo1logo.png" alt="" aria-hidden="true" />
      </div>
    </div>

    <script src="assets/i18n.js?v=20260405-70"></script>
    <script>
      (function () {
        const url = new URL(window.location.href);
        const allowedNextTargets = new Set([
          'index.html',
          'install.html',
          'guide.html',
          'abonnement.html',
          'contact.html',
          'modguard-faq.html',
          'modguard-faq-minecraft.html',
          'modguard-faq-sims.html',
          'modguard-faq-roblox.html',
          'modguard-faq-more.html',
          'loading.html'
        ]);

        function normalizeNextTarget(raw) {
          try {
            const parsed = new URL(String(raw || 'install.html'), window.location.href);
            if (parsed.origin !== window.location.origin) return 'install.html';
            const fileName = (parsed.pathname.split('/').pop() || 'install.html').trim();
            if (!allowedNextTargets.has(fileName)) return 'install.html';
            return fileName;
          } catch {
            return 'install.html';
          }
        }

        try {
          const qLang = url.searchParams.get('lang');
          if (qLang && window.SkimoI18n && typeof window.SkimoI18n.setLanguage === 'function') {
            window.SkimoI18n.setLanguage(qLang, { source: 'manual' });
          }
          if (window.SkimoI18n && typeof window.SkimoI18n.applyTranslations === 'function') {
            window.SkimoI18n.applyTranslations(document);
          }
        } catch {}
        const next = normalizeNextTarget(url.searchParams.get('next'));
        url.searchParams.delete('next');
        const params = url.searchParams.toString();
        const target = params ? `${next}?${params}` : next;
        const isInstall = next === 'install.html';
        const redirectMs = isInstall ? 1900 : 280;
        window.setTimeout(() => {
          window.location.href = target;
        }, redirectMs);
      })();
    </script>
  </body>
</html>
