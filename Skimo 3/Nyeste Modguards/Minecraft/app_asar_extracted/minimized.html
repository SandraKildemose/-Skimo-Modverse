<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Modverse</title>
    <style>
      :root {
        --accent: #8fb4c0;
        --bg: #2f404a;
        --surface: #435762;
        --text: #f5f8fb;
        --muted: rgba(219, 228, 234, 0.84);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        padding: 7px 9px;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg);
        display: flex;
        align-items: center;
        gap: 9px;
        user-select: none;
        border-radius: 12px;
        box-shadow: inset 0 0 0 1px rgba(143, 180, 192, 0.18);
        box-sizing: border-box;
        font-family: -apple-system, system-ui, Arial, sans-serif;
      }

      .logo {
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        filter: none;
        opacity: 0.92;
      }

      .hero-logo-shine {
        position: relative;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
      }

      .hero-logo-shine .logo {
        position: absolute;
        inset: 0;
      }

      .hero-logo-shine .shine-pass {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        filter: brightness(3.1) saturate(1.45);
        clip-path: polygon(-34% 0, -6% 0, 16% 100%, -12% 100%);
      }

      .hero-logo-shine.is-active .shine-pass {
        animation: skimoLogoShinePass 3.1s ease-in-out infinite;
      }

      .logo.blink {
        animation: blink 1.4s infinite;
      }

      .logo.scan {
        animation: blink 0.6s infinite;
      }

      @keyframes skimoLogoShinePass {
        0%,
        18% {
          opacity: 0;
          clip-path: polygon(-34% 0, -6% 0, 16% 100%, -12% 100%);
        }
        24% {
          opacity: 1;
        }
        38% {
          opacity: 0;
          clip-path: polygon(90% 0, 118% 0, 140% 100%, 112% 100%);
        }
        100% {
          opacity: 0;
          clip-path: polygon(90% 0, 118% 0, 140% 100%, 112% 100%);
        }
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0.25;
        }
      }

      .status {
        display: flex;
        flex-direction: column;
        gap: 1px;
        flex: 1 1 auto;
        min-width: 0;
      }

      .title {
        color: var(--text);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .subtitle {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .actions {
        display: flex;
        gap: 4px;
        flex: 0 0 auto;
      }

      .btn {
        background-color: var(--accent);
        border: 1px solid rgba(143, 180, 192, 0.28);
        color: #ffffff;
        padding: 7px 10px;
        cursor: pointer;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
      }

      .btn.secondary {
        background-color: var(--surface);
        color: var(--text);
        border: 1px solid rgba(143, 180, 192, 0.24);
        font-weight: 900;
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <span class="hero-logo-shine hero-logo-shine--minimized is-active" id="logoWrap" aria-hidden="false">
      <img id="logo" src="assets/logomodserve.png" alt="Modverse" class="logo modverse-brand-logo" />
      <img id="logoShine" src="assets/logomodserve.png" alt="" aria-hidden="true" class="logo modverse-brand-logo shine-pass" />
    </span>

    <div class="status">
      <div class="title">SKIMO</div>
      <div id="statusLine" class="subtitle">Modverse …</div>
    </div>

    <div class="actions">
      <button id="openBtn" class="btn secondary" title="Åbn">Åbn</button>
    </div>

    <script src="widget.js"></script>
  </body>
</html>
